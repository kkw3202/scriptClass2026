<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실무 2차원 배열 연습문제</title>
    <style>
        .container,
        h2{
            width: 500px;
            margin: 0 auto;
        }
        .result_wrap{
            margin: 40px 0;
            font-weight: bold;
            font-size: 20px;
        }

    </style>
</head>
<body>
    <h2>자바스크립트 2차원배열 실습 예제</h2>
    <div class="container">
        <h3>성적 분석 프로그램</h3>
        <div id="score_manage_Out"></div>
    </div>

    <script>
        // 데이터
        let names = ['홍길동', '개나리', '진달래'];
        let subjects = ['국어', '영어', '수학'];
        let scores = [
                    [85, 90, 78], // 홍길동
                    [92, 88, 95], // 개나리
                    [76, 85, 83], // 진달래
                    ];

        // 연결부
        let score_manage_Out = document.getElementById('score_manage_Out');

        // 함수
        function render(){
            // 변수
            let result = ''; // 최종 HTML 삽입용
            let result_n = '<p>[학생별 총점과 평균]</p>'; // 최종 HTML 삽입용
            let result_s = '<p>[과목별 평균]</p>'; // 최종 HTML 삽입용
            let result_h = '<p>[최고 점수 학생]</p>'; // 최종 HTML 삽입용


            let high_s = 0;
            let high_nIndex = 0;

            
            

            // 연산

            // 학생별 통계 및 최고점수
            scores.forEach((rValue, rIndex)=>{
                // 변수 선언 및 초기화
                let sum_n = 0;
                let avg_n = 0;

                rValue.forEach((cValue, cIndex)=>{
                    sum_n += rValue[cIndex]
                    if(rValue[cIndex] > high_s){
                        high_s = rValue[cIndex];
                        high_nIndex = rIndex;
                    }
                });
                avg_n = sum_n / rValue.length;

                result_n += `<p>${names[rIndex]} 총점 : ${sum_n}, 평균 : ${avg_n.toFixed(1)}</p>`;
            });

            // 과목별 통계
            for(let i = 0; i < subjects.length; i++){
                let sum_s = 0;
                let avg_s = 0;

                for(let j = 0; j < scores.length; j++){
                    sum_s += scores[j][i];
                    console.log(`(${j},${i})${sum_s}`)
                }     

                avg_s = sum_s / names.length;
                result_s += `<p>${subjects[i]} 평균 : ${avg_s.toFixed(1)}</p>`;
            }
            result_h += `<p>${names[high_nIndex]} (${high_s}점)</p>`
            
            // HTML 삽입 문구
            result += `<div class='result_wrap'>${result_n}</div><div class='result_wrap'>${result_s}</div><div class='result_wrap'>${result_h}</div>`;

            // 최종 삽입
            score_manage_Out.innerHTML = result;

        }

        // 최초 랜더 1회
        render();
    </script>
</body>
</html>
