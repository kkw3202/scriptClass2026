<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2차원 기초 배열문제</title>
</head>
<body>
    <script>
        let arr06 = [
                    [1, 2, 3],
                    [4, 5, 6]
                    ];

        for(let i =0; i<arr06.length; i++){
            let sum = 0;
            for(let j =0; j<arr06[i].length; j++){
                sum += arr06[i][j];
            }
            console.log(`배열의 ${i+1} 번째 행의 합계 : ${sum}`);
        }

        let arr07 =[
                    [3, 9, 2],
                    [8, 7, 6],
                    [1, 4, 5]
                    ];

        let larger_num = 0;
        let inst_arr = new Array();

        for(let i =0; i<arr07.length; i++){
            for(let j =0; j<arr07[i].length; j++){
                // if(arr07[i][j] >  larger_num) larger_num = arr07[i][j];
                inst_arr.push(arr07[i][j]);
            }
        }

        inst_arr.sort();
        let big = inst_arr.pop();

        console.log(`최댓값 : ${big}`);
        // console.log(`최댓값 : ${larger_num}`);
        // console.log(`inst_arr : ${inst_arr}`);


    </script>
</body>
</html>
