<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 연습 기초문제</title>
</head>
<body>
    <p id="p1"></p>
    <p id="p2"></p>
    <p id="p3"></p>
    <p id="p4"></p>
    <p id="p5"></p>

    <script>
        // 연결부
        let p1 = document.getElementById('p1');
        let p2 = document.getElementById('p2');
        let p3 = document.getElementById('p3');
        let p4 = document.getElementById('p4');
        let p5 = document.getElementById('p5');

        // 1. p1 태그에 1번 인덱스 값 출력
        let numbers = [10, 20, 30, 40, 50, 60];
        p1.innerText = numbers[1];

        // 2. p2 태그에 slice를 이용, green 과 blue 만 출력
        let colors = ['red', 'green', 'blue', 'yellow'];
        p2.innerText = colors.slice(1,3);

        // 3. p3 태그에 for 문 이용해 전체 요소 출력
        let names = ['Jason', 'Alice', 'Candy'];
        let names_print = '';
        for(let i=0; i<names.length; i++){
            if(i < names.length-1){
                names_print += `${names[i]} /` + ' ';
            }else{
                 names_print += `${names[i]}`;
            }
        }
        p3.innerText = names_print

        // 4. p4 태그에 1~10 까지 배열 생성 후, 짝수만 출력
        let nums = [];
        let nums_print = [];
        for(let i=1; i<11; i++){
            nums.push(i);
            if(nums[i-1] %2 == 0){
                nums_print.push(nums[i-1])
            }
        }
        console.log(`nums 배열 : ${nums}`);

        p4.innerText = nums_print;

        
        // 5. p5 태그에 score가 80 이상이면 '합격', 아니면 '불합격' 츨력
        let score = [90, 75, 60, 100, 88];
        for(let i =0; i<score.length; i++){
            p5.innerText += `${i+1}번:`
            if(score[i] >= 80){
                p5.innerText += `합격 \n`
            }else{
                p5.innerText += `불합격 \n`
            }
        }
        
    </script>
</body>
</html>
