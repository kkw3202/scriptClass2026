<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실무 연습문제 3</title>
    <style>

        body{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 400px;
            margin: 0 auto;
        }
        table,
        h1{
            width: 400px;
            margin: 10px 0;
        }

        h1{
            text-align: center;
        }

        table, th, td{
            border-collapse: collapse;
            border: 1px solid lightgray;
        }

        span.high{
            color: rgb(201, 27, 27);
        }
        span.low{
            color: rgb(20, 20, 202);
        }
    </style>
</head>
<body>
    <h1>상품 가격 비교</h1>
    <button onclick="get_result()">상품 출력</button>
    <div id="result_print"></div>

    <script>
        // 연결부
        let result_print = document.getElementById('result_print');

        // 함수부
        function get_result(){
            let product_name = ['노트북','마우스','모니터','키보드'];
            let product_price = [120000,30000,80000,40000];
            let result = `<table><tr><th>상품</th><th>가격</th><th>등급</th></tr>`

            for(let i = 0; i<product_name.length; i++){
                let grade = product_price[i] >= 50000 ? '고가' : '저가';
                let gradeClass = product_price[i] >= 50000 ? 'high' : 'low';
                
                result += `<tr><td>${product_name[i]}</td>
                            <td>${product_price[i]}원</td>
                            <td><span class='${gradeClass}'>${grade}</span></td></tr>`
            }

            result_print.innerHTML = result + `</table>`;
        }
    </script>
</body>
</html>
