<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모달 창 만들기</title>
    <link rel="stylesheet" href="/style/ex_modal.css">
    <!-- head 에서 외부의 js 파일과 연결 : defer -->
    <!-- defer : HTML 해석이 끝나고 난 후 실행. -->
    <script src="/js/ex_modal.js" defer></script>
</head>
<body>

    <button class="btn_open">뉴스레터 구독하기</button>
    
    <div class="modal">
        <div class="modal_content">
            <!-- 좌측에 이미지 (Css로) -->
            <div class="photo"></div>
            <!-- 우측 설명 -->
            <div class="description">
                <div class="desc_header">
                    <h2>지금 다양한 혜택을 받아보세요.</h2>
                    <button class="btn_close">&times;</button>
                </div>
                <div class="desc_content">
                    <input type="email" placeholder="이메일 주소를 입력하세요">
                    <button type="button">뉴스레터 구독하기</button>
                    <p>
                        스타트업메이트 뉴스룸의 다양한 소식과 혜택을 이메일로 받아
                        보시려면 구독신청해 주시기 바랍니다. 스타트업메이트에 대해 알고
                        싶은 뉴스, 꼭 알아야할 뉴스를 신속하고 정확하게 전합니다.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay"></div>

    <!-- <script src="/js/ex_modal.js"></script> -->
</body>
</html>
