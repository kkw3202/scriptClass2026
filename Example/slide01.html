<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬라이더(배너) 이미지</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            font-family: sans-serif;
        }

        body{
            background-color: #f5f5f5;
        }

        .slider-wrap{
            position: relative;
            width: 600px;
            height: 350px;
            margin: 100px auto;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .slider-wrap img{
            width: 600px;
            height: 350px;
        }

        .slider-wrap .btns{
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            /* flex 한 후, 각 요소의 간격을 10px 로 설정 */
            gap: 10px;
            /* border: 1px solid red; */
        }

        .slider-wrap .btns span{
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background-color: #ccc;
            cursor: pointer;
        }

        .slider-wrap .btns span.active{
            background-color: dodgerblue;
            /* 크기가 기존의 1.3배 만큼 확대 */
            /* 값이 0.5라면 크기가 기존의 절반으로 축소 */
            transform: scale(1.3);
        }

        .slider-wrap .control{
            position: absolute;
            top: 10px;
            right : 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding:6px 10px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            /* 웹 페이지의 글자나 텍스트를 마우스로 드래그하여 선택하지 못하도록 방지하는 기능 */
            user-select: none;
        }


    </style>
</head>

<body>
    <div class="slider-wrap">
        <div class="slider">
            <img id="photo" src="/images/pic_1.jpg" alt="슬라이드 이미지" />
        </div>
        <div class="btns">
            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="control" id="togglebtn">&#x23F8; 정지</div>
    </div>

    <script>
        let photo = document.getElementById('photo');
        let btns = document.querySelectorAll('.btns span');
        let togglebtn = document.getElementById('togglebtn');

        // 현재 보여주는 슬라이드 번호 초기화
        let currentIndex = 0;
        // span 갯수 초기화
        let spanTotal = btns.length;
        // 현재 슬라이드가 재생중인지 정지상태인지 판가름하는 체크키
        let isPlay = true; // 기본값은 재생
        // setInterval() 함수 적용용 변수
        let timer;

        // 슬라이드에 보여지는 함수 showSlide()
        function showSlide(index){
            // 이미지 변경
            photo.src = `/images/pic_${index+1}.jpg`

            // btns 요소상에서 active 클래스 제거 및 부여
            for(let i =0; i<spanTotal; i++){
                btns[i].classList.remove('active');
            }

            btns[index].classList.add('active');
        }

        // 3초마다 이미지가 변경되는 자동슬라이드 시작 함수
        function startSlide(){
            timer = setInterval(()=>{
                currentIndex = (currentIndex + 1) % spanTotal;

                // currentIndex+1 === spanTotal ? currentIndex = 0 : currentIndex++;

                showSlide(currentIndex);
            }, 3000);
        }

        // 슬라이드 정지 함수
        function stopSlide(){
            clearInterval(timer);
        }

        // 정지 / 재생 버튼 기능 추가
        togglebtn.addEventListener('click', ()=>{
            if(isPlay){
                stopSlide();
                togglebtn.innerText = '▶ 재생';
                isPlay = false;
            }else{
                startSlide();
                togglebtn.innerText = `\u23F8 정지`;
                isPlay = true;
            }
        });

        // span 누르면 해당 배너로 이동
        btns.forEach((value, index)=>{
            value.addEventListener('click', ()=>{
                showSlide(index);
                currentIndex = index;
                if(isPlay){
                    stopSlide();
                    startSlide();
                }
            });
        });


        // 함수 호출부
        showSlide(currentIndex);
        startSlide();
        

    </script>

</body>
</html>
