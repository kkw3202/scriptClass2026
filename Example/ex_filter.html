<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter 메소드</title>
    <style>
        .container{
            width: 400px;
            margin: 100px auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn">과일</button>
        <button class="btn">어류</button>
        <ul class="cart"></ul>
    </div>
    
    <script>
        let menu =[
            {id:0, name:'딸기', category:1},
            {id:1, name:'포도', category:1},
            {id:2, name:'바나나', category:1},
            {id:3, name:'고등어', category:2},
            {id:4, name:'조기', category:2},
            {id:5, name:'갈치', category:2}
        ]

        // 문제 : 과일버튼을 누르면 menu의 오브젝트 배열의 카테고리가 1이면 과일이 li로 추가, 
        // 어류 버튼을 누르면 카테고리가 2인 어류가 li로 추가.

        // DOM 연결부
        let cart = document.querySelector('.cart');
        let btn = document.querySelectorAll('.btn');

        // 전역변수 선언부
        let prt_cart = '';


        // 함수 선언부
       let btn_click = function(btnNum) {
            // console.log('btn_click 호출됨');
            let result = ''; // prt_cart에 삽입할 최종 결과물
            let makeHtml = (menuName) => `<li>${menuName}</li>`; // innerHTML 용 함수

            menu.filter((value) => value.category == btnNum ? result += makeHtml(value.name) : ''); 
            // console.log(menu.length);

            prt_cart = result;
            rander(); // 재랜더링
        }

        // 버튼 누를 경우 btn_click 작동하도록 만들기
        for(let i = 0; i<btn.length; i++){
               btn[i].addEventListener('click', ()=>{
                    btn_click(i+1);
               }) 
        }

        // 랜더링
        function rander(){
            cart.innerHTML = prt_cart;
        }
        
        rander();
    </script>
</body>
</html>
