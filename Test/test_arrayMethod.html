<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 Method</title>
</head>
<body>
    <script>
        // 자바 스크립트의 Array(배열) 의 각종 Method.
        let ranking = ['Jason','Alice','Candy','Chris','Tom'];
        let arrTotal = ['Korea', 90, '2026-09-28'];
        let number = [5, 1, 8, 3, 10];

        console.log('1. pop');
        // 1. pop() : 맨 마지막 요소 삭제 (및 반환)
            // poped을 선언한 것 과 무관하게 ranking 에서 마지막 요소인 Tom 이 사라짐. 대신 poped 에 저장됨
        let poped = ranking.pop();
        console.log(`pop() 한 요소 : ${poped}`);
        console.log(`pop() 한 후 ranking 요소 : ${ranking}`);

        console.log('2. push');
        // 2. push(새 데이터) : 맨 마지막에 새로운 데이터 추가
        ranking.push('David');
        // ranking.push(poped); 
        console.log(`push() 한 후 ranking 요소 : ${ranking}`);

        console.log('3. shift');
        // 3. shift() : 맨 앞 요소 삭제 
            // pop 와 따오는 위치 말고는 동일
        let shifted = ranking.shift();
        console.log(`shift() 한 요소 : ${shifted}`);
        console.log(`shift() 한 후 ranking 요소 : ${ranking}`);

        console.log('4. unshift');
        // 4. unshift(새 데이터) : 맨 앞에 새로운 데이터 추가 
            // push 와 따오는 위치 말고는 동일
        ranking.unshift('Emma');
        console.log(`unshift() 한 후 ranking 요소 : ${ranking}`);

        // 배열 재할당
        ranking = ['Jason','Alice','Candy','Chris','Tom'];

        console.log('5. join');
        // 5. join(연결 할 문자) : 요소와 요소 사이를 () 안의 문자로 연결하여 문자열로 반환
        let joinString = ranking.join('-');
        console.log(`join() 한 후 ranking 요소 : ${ranking}`);
        console.log(`join() 한 후 joinString 요소 : ${joinString}`);

        console.log('6. revers');
        // 6.revers() : 배열의 요소를 반대로 정렬
        ranking.reverse();
        console.log(`reverse() 한 후 ranking 요소 : ${ranking}`);
        
        console.log('7. sort');
        // 7. sort() : 기본적으로 오름차순 정렬
        ranking.sort();
        console.log(`sort() 한 후 ranking 요소 : ${ranking}`);
        
        // 서로 다른 데이터타입을 같이 넣은 배열의 경우. 아래 경우엔 날짜 - 숫자 - 문자
        arrTotal.sort();
        console.log(`sort() 한 후 arrTotal 요소 : ${arrTotal}`);
        
        // 내림차순 (숫자 한정)
        number.sort((a,b) => (b-a));
        console.log(`sort((a,b) => b-a) 한 후 number 요소 : ${number}`);

        console.log('8. slice');
        // 8. slice(시작인덱스번호, 끝인덱스번호) : 지정한 시작 ~ 끝 번호-1(절댓값 기준) 까지의 구간을 잘라서 새 배열로 생성 
        let sliced = ranking.slice(1,3); // ranking[1] ~ ranking[2] 까지 자름
        console.log(`sliced()한 후 sliced 요소 : ${sliced}`);
        console.log(`sliced()한 후 ranking 요소 : ${ranking}`);
        // 끝인덱스번호를 음수로 하면 시작인덱스번호에서 왼쪽으로 이동한 음수값만큼 자른다.
        // 문자열에서 사용하면 문자 수 만큼 자른다.

        console.log('9. splice');
        // 9. splice(시작인덱스번호, 삭제갯수, 새로운 데이터) : 특정 위치에 새 데이터 추가
        // ** 삭제 갯수 만큼 +된 번호까지 삭제.
        // ** 추가도 여러 개 가능.
        let spliced = ranking.splice(2, 1, 'peter');
        console.log(`spliced()한 후 spliced 요소 : ${spliced}`);
        console.log(`spliced()한 후 ranking 요소 : ${ranking}`);

        console.log('10. concat');
        // 10. concat() : 두 배열을 하나로 합쳐서서 새 배열로 반환 (후미에 붙임)
        let newRanking = ranking.concat('Sam', 'John');
        console.log(`concat()한 후 newRanking 요소 : ${newRanking}`);
        console.log(`concat()한 후 ranking 요소 : ${ranking}`);

        // 배열 초기화
        ranking = ['Jason','Alice','Candy','Chris','Tom'];

        console.log('11. indexOf');
        // 11. indexOf() : 특정 요소의 인덱스 위치를 반환. 단, 없다면 -1 로 반환
        let index01 = ranking.indexOf('Alice');
        let index02 = ranking.indexOf('Harry');
        console.log(`Alice의 인덱스 번호 : ${index01}`);
        console.log(`Harry 인덱스 번호 : ${index02}`);

        console.log('12. includes');
        // 12. includes() : 특정 값이 존재하면 true, 존재하지 않으면 false
        let hasTom = ranking.includes('Tom');
        let hasJack = ranking.includes('Jack');
        console.log(`hasTom 결과값 : ${hasTom}`);
        console.log(`hasJack 결과값 : ${hasJack}`);

        console.log('13. split');
        // 13. split(구분자) : 나열된 하나의 문자를 구분자를 기준으로 쪼개서 배열로 생성
        let test ='사과, 포도, 딸기';
        let result = test.split(', ');
        console.log(`test 결과 : ${result.join('/')}`);

    </script>
</body>
</html>
