<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: sans-serif;
            font-size: 30px;
        }
        #menu_wrap a{
            text-decoration: none;
            color: #222;
            padding-bottom: 12px;
            border-bottom: 4px solid transparent;
        }
        #menu_wrap a.active{
            border-bottom-color: #222;
        }

        ul{
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #menu_wrap{
            width: 500px;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    <nav id="menu_wrap">
        <ul>
            <li><a href="#">베스트</a></li>
            <li><a href="#">세일</a></li>
            <li><a href="#">패션</a></li>
            <li><a href="#">리빙</a></li>
            <li><a href="#">신상</a></li>
        </ul>
    </nav>

    <script>
        // 동시에 여러개에 모두 접근 가능한 DOM = querySelectorAll
        let menuList = document.querySelectorAll('#menu_wrap a');
        console.log('menuList : ', menuList);
        menuList.forEach((value)=>{
            // a태그 모두 마우스 호버 주려면..
            // .addEventListener('이벤트 종류', () => {...}) // 이벤트 종류는 마우스 엔터, 클릭 등...
            value.addEventListener('click', ()=>{
                value.style.color='blue';
            });
            value.addEventListener('mouseenter', ()=>{
                // .classList.add() 태그에 class 추가
                value.classList.add('active');
            });
            value.addEventListener('mouseleave', ()=>{
                // .classList.add() 태그에 class 추가
                value.classList.remove('active');
                value.style.color='#222';
            });
        });
    </script>
</body>
</html>
