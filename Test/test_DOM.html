<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>queryseletor 연습</title>
</head>
<body>
    <div class="orderlist">1. 아메리카노 - 4,000원</div>
    <div class="orderlist">2. 카페라떼 - 4,500원</div>
    <div class="orderlist">3. 치즈케이크 - 6,000원</div>
    <div id="orderlist">4. 치즈케이크 - 6,000원</div>

    <button class="pay">결제하기 버튼</button>

    <ul>
        <li onclick="pay()">aaaa</li>
        <li onclick="pay01()">bbbb</li>
    </ul>
    
    <script>
        // DOM 객체 : HTML 문서에 접근하는 방법
        // document.queryseletor('');
        // 조건에 만족하는 첫 번째 단 하나의 요소에만 접근. id와 class 모두 접근.
        let order = document.querySelector('.orderlist');
        let order02 = document.querySelector('#orderlist');
        
        order.style.color='blue';
        // document.queryseletorAll('');
        // 조건에 만족하는 모든 요소에만 접근
        let orderList = document.querySelectorAll('.orderlist');
        // orderList[0].style.color='red';

        function pay(){
            orderList[0].style.color='red';
        }
    </script>

</html>
