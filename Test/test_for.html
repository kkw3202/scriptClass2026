<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문 : for</title>
</head>
<body>
    <button onclick="input_for1to10()">숫자 넣기</button>
    <p id="for1to10_print"></p>
    <script>
        // while(조건식) { 실행문 }
        let num = 0;
        while(num<5){
            console.log(`num : ${num}`);
            num++;
            console.log(`num 누적 후 : ${num}`)
        }

        // do { 실행문 } whlie(조건식) => 무조건한번 실행 후, 조건 확인. 이후 반복하다 조건을 만족하지 못하면 탈출
        
        let num1 = 0;
        do{
            console.log('무조건 한번은 출력')
            num1++;
            console.log(`num1의 누적 : ${num1}`)
        }while(num1<3);

        console.log(`num1's count: ${num1}`)

        // for 문 : 조건을 만족 할 때 까지 순회
        // const 키워드로는 i 를 선언 할 수 없다. i가 증감한 값을 재할당하지 못하기 때문. let (혹은 var)로 선언해야함.
        for(let i=0; i<5; i++){
            console.log(`반복 i : ${i}`)
        }


        let for1to10 = document.getElementById('for1to10_print');
        // 1 ~ 10 출력 p태그에 for문으로
        function input_for1to10(){
            let numAdd = '';
            console.log(typeof numAdd)
            for(let i = 1; i<11; i++){
                numAdd += i + " ";
            }
            // for1to10.innerText = numAdd;

            for1to10.innerHTML = numAdd; //dom 으로 지정한 변수의 태그 안으로 작성한 태그까지 넣어준다.


        }

    </script>
</body>
</html>
